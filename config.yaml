name: piamp

# This file defines static topology only.
# Active routes and mixing are runtime state managed via the API.

inputs:
  - name: tv
    source: pipewire
    channels: ["L", "R"]
  - name: music
    source: pipewire
    channels: ["L", "R"]
  - name: aux
    source: pipewire
    channels: ["L", "R"]

zones:
  - name: living_room
    output_device: default
    output_channels: ["L", "R"]
  - name: kitchen
    output_device: default
    output_channels: ["L", "R"]
  - name: office
    output_device: default
    output_channels: ["L", "R"]
